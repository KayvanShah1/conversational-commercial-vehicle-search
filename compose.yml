services:
  vivi:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: vivi-vehicle-search:local
    env_file:
      - .env
    environment:
      PORT: "10000"
      PROJECT_ROOT: /app
      DATA_DIR: /app/data
      LOG_DIR: /app/logs
      SESSION_DATA_PATH: /app/data/sessions
      SESSION_DB_PATH: /app/data/sessions/agent_sessions.sqlite
    ports:
      - "8501:10000"
    volumes:
      - vivi-sessions:/app/data/sessions
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:10000/_stcore/health', timeout=4)"
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 5
    restart: unless-stopped

volumes:
  vivi-sessions:
