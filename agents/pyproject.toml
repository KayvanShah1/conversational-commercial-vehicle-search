[project]
name = "agents"
version = "0.1.0"
description = "Grounded conversational search for the commercial-vehicle catalog"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "duckdb>=1.4.0",
    "openai-agents>=0.22.0",
    "vehicle-search-utils",
]

[tool.uv.sources]
vehicle-search-utils = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vehicle_search_agent"]
