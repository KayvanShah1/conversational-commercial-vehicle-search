[project]
name = "vehicle-search-utils"
version = "0.1.0"
description = "Shared configuration and utilities for the vehicle search workspace"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["pydantic>=2.10.0", "pydantic-settings>=2.0.0", "rich>=14.0.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vehicle_search_utils"]
