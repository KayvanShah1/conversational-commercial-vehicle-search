[project]
name = "vehicle-catalog-generator"
version = "0.1.0"
description = "Generate and load a reproducible synthetic commercial-vehicle catalog"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "polars>=1.44.1",
    "vehicle-search-utils",
]

[tool.uv.sources]
vehicle-search-utils = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/vehicle_catalog_generator"]
