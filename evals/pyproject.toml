[project]
name = "evals"
version = "0.1.0"
description = "Executable behavior, grounding, and latency evaluations for Vivi"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "agents",
    "rich>=14.0.0",
    "vehicle-search-utils",
]

[dependency-groups]
dev = ["pytest>=9.0.0", "ruff>=0.14.9"]

[tool.uv.sources]
agents = { workspace = true }
vehicle-search-utils = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/evals"]
